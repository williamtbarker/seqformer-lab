[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seqformer-lab"
version = "0.1.0"
description = "Reproducible transformer experiments for timestamped symbolic sequences"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Will Barker" }]
keywords = ["transformer", "pytorch", "sequence-modeling", "temporal-validation", "machine-learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.26,<2.3", "torch>=2.2,<2.7"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.6",
  "setuptools>=75",
  "wheel>=0.44",
]

[project.scripts]
seqformer-lab = "seqformer_lab.cli:main"

[project.urls]
Homepage = "https://github.com/williamtbarker/seqformer-lab"
Issues = "https://github.com/williamtbarker/seqformer-lab/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seqformer_lab = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["seqformer_lab"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
